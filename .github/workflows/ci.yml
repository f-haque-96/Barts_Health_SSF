# CI/CD Pipeline for NHS Barts Health Supplier Setup Form
# Updated: February 2026 - Enhanced package-lock validation & build verification
name: CI - Lint and Build

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Verify package-lock.json exists
        run: |
          if [ ! -f package-lock.json ]; then
            echo "Error: package-lock.json not found"
            exit 1
          fi
          echo "✓ package-lock.json found"

      - name: Validate markdown links
        run: npm run docs:check-links

      # Frontend
      - name: Install frontend dependencies
        run: npm ci

      # L4: ESLint failures now block deployment
      - name: Lint frontend code
        run: npm run lint --if-present
        continue-on-error: false

      # Unit tests (Vitest) — workflow state machine, transition legality,
      # VAT COS mapping. Fast, browser-free; blocks the build on failure.
      # (The end-to-end Playwright suite lives in e2e/ and runs locally /
      # nightly — it needs a dev server + mock services, see e2e/README.md.)
      - name: Run unit tests
        run: npm test
        continue-on-error: false

      - name: Build frontend
        run: |
          echo "Building frontend application..."
          npm run build
          echo "✓ Frontend build complete"
          ls -lh dist/ || echo "Warning: dist/ directory not found"

      # Security audit — INFORMATIONAL (changed 23 Jul 2026). The report still
      # runs and prints every high advisory on every build for manual review,
      # but no longer hard-blocks. Rationale (this is the S9 finding from the
      # deployment readiness review, now realised):
      #   * The deployed artifact is a client-only static SPA (no server, no
      #     SSR/RSC, no dev server in production).
      #   * The residual high advisories do not apply to it: esbuild's is
      #     "dev server on Windows" (never shipped); react-router's is
      #     "RSC Mode CSRF" (React Server Components — not used here).
      #   * There is currently NO react-router 7.x/8.x version that clears
      #     `npm audit` — the only offered "fix" is a downgrade that
      #     reintroduces other advisories. Hard-blocking on this stalls every
      #     unrelated change until upstream ships a patch.
      # Genuinely-fixable advisories are still remediated promptly (react-router
      # bumped to 7.18.x + `npm audit fix` applied 23 Jul). Revisit and
      # re-tighten to blocking once react-router publishes a clean release.
      # --omit=dev focuses the report on production runtime dependencies.
      - name: Run npm audit (frontend, informational)
        run: |
          echo "High-severity advisories (production deps) — reviewed manually, non-blocking:"
          npm audit --omit=dev --audit-level=high || true
        continue-on-error: true

      # Backend (supplier-form-api/) is FROZEN — kept for reference, not deployed.
      # These steps are informational only and must never block a frontend release.
      - name: Install backend dependencies (frozen - informational)
        run: |
          cd supplier-form-api
          npm ci
          echo "✓ Backend dependencies installed"
        continue-on-error: true

      - name: Lint backend code (frozen - informational)
        run: |
          cd supplier-form-api
          npm run lint --if-present
        continue-on-error: true

      - name: Run npm audit (backend, frozen - informational)
        run: |
          cd supplier-form-api
          npm audit --audit-level=high
        continue-on-error: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: build-${{ matrix.node-version }}
          path: dist/
          retention-days: 7
          if-no-files-found: warn

# Updated: Mar 2026 - CI compliance
